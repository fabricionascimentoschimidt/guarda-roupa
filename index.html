<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f2119">
<title>Guarda-roupa do Fabricio</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topo">
  <h1>Guarda-roupa <span>do Fabricio</span></h1>
  <nav class="abas">
    <button class="aba ativa" data-aba="armario">Armário</button>
    <button class="aba" data-aba="looks">Looks</button>
  </nav>
</header>
<main>
  <section id="armario" class="painel">
    <div class="filtros">
      <div class="chips" id="chips-cat"></div>
      <div class="chips" id="chips-cor"></div>
      <p class="contagem" id="contagem"></p>
    </div>
    <div class="grade" id="grade"></div>
  </section>
  <section id="looks" class="painel" hidden>
    <div class="lista-looks" id="lista-looks"></div>
  </section>
</main>
<div class="fundo" id="fundo" hidden></div>
<aside class="folha" id="folha" aria-hidden="true">
  <div class="alca"></div>
  <button class="fechar" id="fechar" aria-label="Fechar">×</button>
  <div id="folha-conteudo"></div>
</aside>
<script src="app.js"></script>
</body>
</html>
